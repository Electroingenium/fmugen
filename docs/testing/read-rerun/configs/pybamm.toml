# fmugen.toml: how this Python model becomes an FMU. Reference: docs/config.md
# Generated by `fmugen init`; check the start values, add units, and remove what you don't need.

[model]
entry = "pybamm:Simulation"
call = "step"
requirements = ["pybamm==26.10.1.1"]  # the versions installed here; installed by --vendor
# no init_call: a second step() with the same inputs changed t, t_eval, t_event and 4 more, so running it at initialization would put the outputs a step ahead

# Arguments whose code default is not an FMI value; the default is used.
# To override one, uncomment the line.
[model.constants]
model = { call = "pybamm.lithium_ion:SPM()" }  # computed when the FMU initializes
# experiment = { python = "None" }
# geometry = { python = "None" }
# parameter_values = { python = "None" }
# submesh_types = { python = "None" }
# var_pts = { python = "None" }
# spatial_methods = { python = "None" }
# solver = { python = "None" }
# output_variables = { python = "None" }
# C_rate = { python = "None" }
# discretisation_kwargs = { python = "None" }

# Arguments whose code default is not an FMI value; the default is used.
# To override one, uncomment the line and the table header.
# [model.call_constants]
# solver = { python = "None" }
# t_eval = { python = "None" }
# starting_solution = { python = "None" }
# inputs = { python = "None" }

[parameters]
cache_esoh = { start = true }
experiment_model_mode = { start = "legacy" }

[inputs]
dt = { start = 100.0 }  # from --start, so a fixed value; to pass the simulation time instead, remove it and add [time] dt = "step_size"
save = { start = true }

[outputs]
hermite_interpolation = { from = "return:hermite_interpolation", type = "Boolean" }
observable = { from = "return:observable", type = "Boolean" }
t_eval = { from = "return:t_eval.-1" }  # its last entry: the whole return:t_eval grows each step ([2] then [6]), and an FMI array has a fixed size
t_event = { from = "return:t_event.0" }
termination = { from = "return:termination", type = "String" }
y_event = { from = "return:y_event", dimensions = [42, 1] }
t = { from = "return:t.-1" }  # --read; np.float64(100.0) in the probe
voltage = { from = "return:Voltage [V].entries.-1" }  # --read; np.float64(3.760580026848197) in the probe
# y: its size changed from [42, 25] to [42, 55] on a second probe call, and an FMI array has a fixed size
# y = { from = "return:y", dimensions = [...] }
# yp: its size changed from [42, 25] to [42, 55] on a second probe call, and an FMI array has a fixed size
# yp = { from = "return:yp", dimensions = [...] }
