# fmugen.toml: how this Python model becomes an FMU. Reference: docs/config.md
# Generated by `fmugen init`; check the start values, add units, and remove what you don't need.

[model]
entry = "openmdao.api:Problem"
call = "run_model"  # run_model() guessed: it's not clear which method runs a step (candidates, best first: run_model, run_driver, compute_totals, check_config, check_partials, check_totals, find_feasible, get_outputs_dir, …); pass --call METHOD to choose another
setup = ["setup()"]  # setup() before the first step: run_model() failed without it in the probe
save_state = ["_reports", "cite", "_computing_coloring", "comm", "_name", "_run_counter", "_rec_mgr", "options", "model_options", "recording_options", "_orig_mode", "_check", "_logger"]  # the whole object can't be pickled (TypeError: cannot pickle 'weakref.ReferenceType' object); saved: these attributes only. Not saved, kept as they are on restore: _driver, model, _metadata, final_setup, _check_collected_errors, run_driver. Check those don't change during a simulation, else set save_state = false
globals = ["openmdao.utils.coloring:_force_dyn_coloring", "openmdao.utils.coloring:_use_partial_sparsity", "openmdao.utils.coloring:_use_total_sparsity", "openmdao.utils.hooks:_hook_counter", "openmdao.utils.mpi:_under_mpi_cache", "openmdao.utils.reports_system:_plugins_loaded", "openmdao.visualization.timing_viewer.timer:_timing_active", "openmdao.visualization.timing_viewer.timer:_total_time"]  # module-level state the model changes while it runs: put back on reset and saved with the FMU state
requirements = ["openmdao==3.45.2"]  # the versions installed here; installed by --vendor

# Arguments whose code default is not an FMI value; the default is used.
# To override one, uncomment the line.
[model.constants]
model = { call = "openmdao.test_suite.components.sellar:SellarNoDerivatives()" }  # computed when the FMU initializes
# driver = { python = "None" }
# comm = { python = "None" }
# name = { python = "None" }
# reports = ...

# Arguments whose code default is not an FMI value; the default is used.
# To override one, uncomment the line and the table header.
# [model.call_constants]
# case_prefix = { python = "None" }

[inputs]
reset_iter_counts = { start = true }

[outputs]
msginfo = { type = "String" }  # a property of the object
y1 = { from = "attr:y1.0" }  # --read; np.float64(27.8) in the probe
y2 = { from = "attr:y2.0" }  # --read; np.float64(12.272570530585627) in the probe
obj = { from = "attr:obj.0" }  # --read; np.float64(30.800004678324473) in the probe
con1 = { from = "attr:con1.0" }  # --read; np.float64(-24.64) in the probe
con2 = { from = "attr:con2.0" }  # --read; np.float64(-11.727429469414373) in the probe
