# fmugen.toml: how this Python model becomes an FMU. Reference: docs/config.md
# Generated by `fmugen init`; check the start values, add units, and remove what you don't need.

[model]
entry = "flopy.mf6:MFSimulation"
create = "load"  # MFSimulation.load(...) builds it: exe_name, sim_ws are paths that exist, which load() reads (pass --create to choose another)
call = "run_simulation"  # run_simulation() guessed: it's not clear which method runs a step (candidates, best first: run_simulation, check, delete_output_files, get_model, get_package, is_valid, write_simulation, plot, …); pass --call METHOD to choose another
init_call = true  # run_simulation() changed nothing in the probe, so it also runs at initialization: outputs have values at the start time
requirements = ["flopy==3.12.0"]  # the versions installed here; installed by --vendor

# Arguments whose code default is not an FMI value; the default is used.
# To override one, uncomment the line and the table header.
# [model.constants]
# load_only = { python = "None" }

# Arguments whose code default is not an FMI value; the default is used.
# To override one, uncomment the line and the table header.
# [model.call_constants]
# silent = { python = "None" }
# processors = { python = "None" }
# cargs = { python = "None" }
# custom_print = { python = "None" }

[parameters]
sim_name = { start = "modflowsim" }
version = { start = "mf6" }  # kept as an attribute: add variability = "tunable" if the step reads it
exe_name = { start = "<rerun>/data/bin/mf6.exe" }  # start from --start
sim_ws = { start = "<rerun>/flopy/ws" }  # start from --start
strict = { start = true }
verbosity_level = { start = 1 }  # Integer because the default is an int; write a float start for Real
verify_data = { start = false }
write_headers = { start = true }
lazy_io = { start = false }
use_pandas = { start = true }

[inputs]
pause = { start = false }
report = { start = false }
normal_msg = { start = "normal termination" }
use_async = { start = false }

[outputs]
# skipped 'y1': not an FMI value or not a valid name
y0 = { from = "return:0", type = "Boolean" }
heads = { from = "attr:get_model().output.head().get_data()", dimensions = [1, 1, 10] }  # --read; array([[[10.        ,  9.14963777,  8... in the probe
