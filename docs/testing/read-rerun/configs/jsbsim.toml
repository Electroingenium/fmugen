# fmugen.toml: how this Python model becomes an FMU. Reference: docs/config.md
# Generated by `fmugen init`; check the start values, add units, and remove what you don't need.

[model]
entry = "jsbsim:FGFDMExec"
setup = ["load_model('c172x')", "run_ic"]
call = "run"
save_state = false  # the model object can't be pickled (TypeError: no default __reduce__ due to non-trivial __cinit__): the FMU can't save and restore its state
requirements = ["jsbsim==1.3.3"]  # the versions installed here; installed by --vendor
# no init_call: a second run() with the same inputs changed airspeed_kts, altitude_ft, pitch_rad and 1 more, so running it at initialization would put the outputs a step ahead

[model.constants]
0 = { call = "jsbsim:get_default_root_dir()" }  # computed when the FMU initializes

[outputs]
y = { from = "return", type = "Boolean" }
aircraft_path = { from = "get:get_aircraft_path", type = "String" }  # returned by get_aircraft_path() after the step
debug_level = { from = "get:get_debug_level" }  # returned by get_debug_level() after the step
delta_t = { from = "get:get_delta_t" }  # returned by get_delta_t() after the step
engine_path = { from = "get:get_engine_path", type = "String" }  # returned by get_engine_path() after the step
full_aircraft_path = { from = "get:get_full_aircraft_path", type = "String" }  # returned by get_full_aircraft_path() after the step
model_name = { from = "get:get_model_name", type = "String" }  # returned by get_model_name() after the step
output_path = { from = "get:get_output_path", type = "String" }  # returned by get_output_path() after the step
propulsion_tank_report = { from = "get:get_propulsion_tank_report", type = "String" }  # returned by get_propulsion_tank_report() after the step
root_dir = { from = "get:get_root_dir", type = "String" }  # returned by get_root_dir() after the step
systems_path = { from = "get:get_systems_path", type = "String" }  # returned by get_systems_path() after the step
trim_status = { from = "get:get_trim_status", type = "Boolean" }  # returned by get_trim_status() after the step
version = { from = "get:get_version", type = "String" }  # returned by get_version() after the step
sim_time = { from = "attr:simulation/sim-time-sec" }  # --read; 0.008333333333333333 in the probe
altitude_ft = { from = "attr:position/h-sl-ft" }  # --read; 3.863126039505005e-06 in the probe
airspeed_kts = { from = "attr:velocities/vc-kts" }  # --read; 6.40868933101758 in the probe
pitch_rad = { from = "attr:attitude/theta-rad" }  # --read; 2.220446049250566e-16 in the probe
