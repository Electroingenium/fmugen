# fmugen.toml: how this Python model becomes an FMU. Reference: docs/config.md
# Generated by `fmugen init`; check the start values, add units, and remove what you don't need.

[model]
entry = "filterpy.kalman:KalmanFilter"
call = "predict"
requirements = ["filterpy==1.4.5"]  # the versions installed here; installed by --vendor

# Arguments whose code default is not an FMI value; the default is used.
# To override one, uncomment the line and the table header.
# [model.call_constants]
# u = { python = "None" }
# B = { python = "None" }
# F = { python = "None" }
# Q = { python = "None" }

[parameters]
dim_x = { start = 2 }  # start from the example in the README of filterpy: check it
dim_z = { start = 1 }  # start from the example in the README of filterpy: check it
dim_u = { start = 0 }  # Integer because the default is an int; write a float start for Real

[outputs]
alpha = {}  # a property of the object
likelihood = {}  # a property of the object
log_likelihood = {}  # a property of the object

[locals]
P = { dimensions = [2, 2] }  # changed by predict()
P_prior = { dimensions = [2, 2] }  # changed by predict()
