# fmugen.toml: how this Python model becomes an FMU. Reference: docs/config.md
# Generated by `fmugen init`; check the start values, add units, and remove what you don't need.

[model]
entry = "sklearn.linear_model:Ridge"
call = "predict"  # predict() guessed: it's not clear which method runs a step (candidates, best first: predict, get_metadata_routing, fit, get_params, score, set_params, set_fit_request, set_score_request); pass --call METHOD to choose another
requirements = ["numpy==2.5.5", "scikit-learn==1.9.1"]  # the versions installed here; installed by --vendor
# setup = ["fit(...)"]  # predict() needs fit() first: give it your training data and uncomment this; the probe trained on made-up data (64 samples, 4 features) only to find the inputs and outputs

# Arguments whose code default is not an FMI value; the default is used.
# To override one, uncomment the line and the table header.
# [model.constants]
# max_iter = { python = "None" }
# random_state = { python = "None" }

[parameters]
alpha = { start = 1.0 }  # kept as an attribute: add variability = "tunable" if the step reads it
fit_intercept = { start = true }  # kept as an attribute: add variability = "tunable" if the step reads it
copy_X = { start = true }  # kept as an attribute: add variability = "tunable" if the step reads it
tol = { start = 0.0001 }  # kept as an attribute: add variability = "tunable" if the step reads it
solver = { start = "auto" }  # kept as an attribute: add variability = "tunable" if the step reads it
positive = { start = false }  # kept as an attribute: add variability = "tunable" if the step reads it

[inputs]
X = { dimensions = [1, 4], start = [1.0, 1.0, 1.0, 1.0], numpy = true }  # no default in the code: made up, as arrays of ones, shape (1, 4) (the probe failed with 1.0); check it

[outputs]
y = { from = "return", dimensions = [1] }
