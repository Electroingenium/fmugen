# fmugen.toml: how this Python model becomes an FMU. Reference: docs/config.md
# Generated by `fmugen init`; check the start values, add units, and remove what you don't need.

[model]
entry = "sklearn.ensemble:RandomForestRegressor"
call = "predict"  # predict() as in the docstring of RandomForestRegressor
init_call = true  # predict() changed nothing in the probe, so it also runs at initialization: outputs have values at the start time
requirements = ["scikit-learn==1.9.1"]  # the versions installed here; installed by --vendor
# setup = ["fit(...)"]  # predict() needs fit() first: give it your training data and uncomment this; the probe trained on made-up data (64 samples, 4 features) only to find the inputs and outputs
# --compile won't work: the model's libraries read their own source files by path (torch/_native/ops/topk/aot.py), and a compiled FMU has none; build without --compile, or with --vendor

# Arguments whose code default is not an FMI value; the default is used.
# To override one, uncomment the line and the table header.
# [model.constants]
# max_depth = { python = "None" }
# max_leaf_nodes = { python = "None" }
# n_jobs = { python = "None" }
# random_state = { python = "None" }
# max_samples = { python = "None" }
# monotonic_cst = { python = "None" }

[parameters]
n_estimators = { start = 100 }  # Integer because the default is an int; write a float start for Real; changing it in the probe changed nothing, with these start values
criterion = { start = "squared_error" }  # kept as an attribute: add variability = "tunable" if the step reads it
min_samples_split = { start = 2 }  # Integer because the default is an int; write a float start for Real; changing it in the probe changed nothing, with these start values
min_samples_leaf = { start = 1 }  # Integer because the default is an int; write a float start for Real; changing it in the probe changed nothing, with these start values
min_weight_fraction_leaf = { start = 0.0 }  # kept as an attribute: add variability = "tunable" if the step reads it; changing it in the probe changed nothing, with these start values
max_features = { start = 1.0 }  # kept as an attribute: add variability = "tunable" if the step reads it; changing it in the probe changed nothing, with these start values
min_impurity_decrease = { start = 0.0 }  # kept as an attribute: add variability = "tunable" if the step reads it; changing it in the probe changed nothing, with these start values
bootstrap = { start = true }  # kept as an attribute: add variability = "tunable" if the step reads it; changing it in the probe changed nothing, with these start values
oob_score = { start = false }  # kept as an attribute: add variability = "tunable" if the step reads it; changing it in the probe changed nothing, with these start values
verbose = { start = 0 }  # Integer because the default is an int; write a float start for Real; changing it in the probe changed nothing, with these start values
warm_start = { start = false }  # kept as an attribute: add variability = "tunable" if the step reads it; changing it in the probe changed nothing, with these start values
ccp_alpha = { start = 0.0 }  # kept as an attribute: add variability = "tunable" if the step reads it; changing it in the probe changed nothing, with these start values

[inputs]
X = { dimensions = [1, 4], type = "Integer", start = [0, 0, 0, 0] }  # start from the example in the docstring of RandomForestRegressor: check it

[outputs]
y = { from = "return", dimensions = [1] }
feature_importances_ = { dimensions = [4] }  # a property of the object
