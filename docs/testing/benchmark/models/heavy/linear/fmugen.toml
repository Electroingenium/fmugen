# fmugen.toml: how this Python model becomes an FMU. Reference: docs/config.md
# Generated by `fmugen init`; check the start values, add units, and remove what you don't need.

[model]
entry = "torch.nn:Linear"
init_call = true  # __call__() changed nothing in the probe, so it also runs at initialization: outputs have values at the start time
globals = ["torch.__future__:_overwrite_module_params_on_conversion", "torch.__future__:_swap_module_params_on_conversion", "torch._export.utils:_DISABLE_ATEN_TO_ASSERTION_PASS", "torch._functorch.eager_transforms:JVP_NESTING", "torch._functorch.predispatch:DECOMPOSITIONS_LOADED", "torch._higher_order_ops.local_map:_DEFER_INLINING", "torch._logging._internal:GET_DTRACE_STRUCTURED", "torch._native.ops.foreach_mm.impl:_nvmath_warned", "torch._native.registry:_node_id_counter", "torch._subclasses.fake_tensor:RECURSION_COUNT", "torch._subclasses.meta_utils:DESCRIBER_NEXT_ID", "torch.autograd.forward_ad:_current_level", "torch.autograd.graph:_allow_mutation_on_saved_tensors_enabled", "torch.autograd.profiler:_is_profiler_enabled", "torch.backends.mha:_is_fastpath_enabled", "torch.compiler:_is_compiling_flag", "torch.compiler:_is_non_strict_tracing_flag", "torch.cuda._graph_annotations:_annotation_backend", "torch.cuda._graph_annotations:_annotation_key_by", "torch.cuda._graph_annotations:_annotations_enabled", "torch.cuda._graph_annotations:_stream_id_counter", "torch.cuda:_initialized", "torch.distributed.device_mesh:_distributed_opaque_types_registered", "torch.distributed.distributed_c10d:_group_count", "torch.distributed.rpc:_init_counter", "torch.export.unflatten:RUN_WITH_INTERPRETER", "torch.fx._lazy_graph_module:_force_skip_lazy_graph_module_flag", "torch.fx._lazy_graph_module:_use_lazy_graph_module_flag", "torch.fx.traceback:_should_preserve_node_meta", "torch.fx.traceback:should_preserve_node_meta", "torch.jit._script:_TOPLEVEL", "torch.mtia:_initialized", "torch.multiprocessing:_sharing_strategy", "torch.nn.utils.parametrize:_cache_enabled", "torch.package._mangling:_mangle_index", "torch.random:_fork_rng_warned_already", "torch.sparse.semi_structured:_cusparselt_mm_registered", "torch.sparse.semi_structured:_cutlass_mm_registered", "torch.storage:_always_warn_typed_storage_removal", "torch.utils._debug_mode._mode:_ACTIVE_DEBUG_MODE_COUNT", "torch.utils._debug_mode._mode:_annotate_decorated", "torch.utils._python_dispatch:_is_in_any_mode_without_ignore_compile_internals", "torch.utils._python_dispatch:_is_in_non_infra_torch_dispatch_mode", "torch.utils._python_dispatch:_is_in_torch_dispatch_mode", "torch.utils.backend_registration:_privateuse1_backend_name", "torch.utils.data._utils.signal_handling:_SIGCHLD_handler_set", "torch.utils.data._utils:python_exit_status", "torch.utils.data.dataloader:_persistent_workers_atexit_registered", "torch.utils.data.datapipes._decorator:_determinism", "torch.utils.data.datapipes._decorator:_runtime_validation_enabled", "torch.xpu:_initialized"]  # module-level state the model changes while it runs: put back on reset and saved with the FMU state
requirements = ["torch==2.15.0"]  # the versions installed here; installed by --vendor
# --compile won't work: the model's libraries read their own source files by path (torch/_native/ops/topk/aot.py), and a compiled FMU has none; build without --compile, or with --vendor

# Arguments whose code default is not an FMI value; the default is used.
# To override one, uncomment the line and the table header.
# [model.constants]
# device = { python = "None" }
# dtype = { python = "None" }

[parameters]
in_features = { start = 4 }  # start from --start; changing it in the probe changed nothing, with these start values
out_features = { start = 2 }  # start from --start; changing it in the probe changed nothing, with these start values
bias = { start = true }

[inputs]
input = { dimensions = [4], start = [1.0, 1.0, 1.0, 1.0], convert = "torch:tensor" }  # no default in the code: made up, the tensors as torch tensors of ones, shape (4,), the others as made up (the probe failed with 1.0); check it

[outputs]
y = { from = "return", dimensions = [2] }
