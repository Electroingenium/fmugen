# fmugen.toml: how this Python model becomes an FMU. Reference: docs/config.md
# Generated by `fmugen init`; check the start values, add units, and remove what you don't need.

[model]
entry = "pvlib.solarposition:get_solarposition"
requirements = ["pvlib==0.16.1"]  # the versions installed here; installed by --vendor

# Arguments whose code default is not an FMI value; the default is used.
# To override one, uncomment the line and the table header.
# [model.constants]
# altitude = { python = "None" }
# pressure = { python = "None" }

[time]
time = "time"

[inputs]
latitude = { start = 1.0 }  # no default in the code: check the start value
longitude = { start = 1.0 }  # no default in the code: check the start value
method = { start = "nrel_numpy" }
temperature = { start = 12.0 }

[outputs]
apparent_zenith = {}
zenith = {}
apparent_elevation = {}
elevation = {}
azimuth = {}
equation_of_time = {}
