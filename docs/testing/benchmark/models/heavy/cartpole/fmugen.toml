# fmugen.toml: how this Python model becomes an FMU. Reference: docs/config.md
# Generated by `fmugen init`; check the start values, add units, and remove what you don't need.

[model]
entry = "gymnasium.envs.classic_control.cartpole:CartPoleEnv"
call = "step"
setup = ["reset(seed=0)"]  # reset(seed=0) before the first step: it's an environment (an action and an observation space), which starts with reset(); seed=0 so each run gives the same results
requirements = ["gymnasium==1.4.0"]  # the versions installed here; installed by --vendor

# Arguments whose code default is not an FMI value; the default is used.
# To override one, uncomment the line and the table header.
# [model.constants]
# render_mode = { python = "None" }

[parameters]
sutton_barto_reward = { start = false }

[inputs]
action = { start = 0 }  # no default in the code: made up, from the model's action or observation space (the probe failed with 1.0); check it

[outputs]
# skipped 'y4': not an FMI value or not a valid name
y0 = { from = "return:0", dimensions = [4] }
y1 = { from = "return:1" }
y2 = { from = "return:2", type = "Boolean" }
y3 = { from = "return:3", type = "Boolean" }
np_random_seed = {}  # a property of the object
# surf: not set by step() in the probe; reading it fails the step whenever the model hasn't set it
# surf = {}

[locals]
state = { dimensions = [4] }  # changed by step()
