# fmugen.toml: how this Python model becomes an FMU. Reference: docs/config.md
# Generated by `fmugen init`; check the start values, add units, and remove what you don't need.

[model]
entry = "tank.py:Tank"
call = "step"

[time]
dt = "step_size"

[parameters]
area = { start = 1.0, variability = "tunable" }  # tunable: the step reads it (changing it in the probe changed the results)
level0 = { start = 0.0 }

[inputs]
q = { start = 1.0 }  # no default in the code: check the start value

[outputs]
y = { from = "return" }

[locals]
level = {}  # changed by step()
