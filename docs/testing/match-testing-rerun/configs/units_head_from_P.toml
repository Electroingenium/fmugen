# docs/testing/tested-models.md "Hand configs / fluids.units": the `init` config with convert = "pint"
# and a unit on each input, and the output in cm
[model]
entry = "fluids.units:head_from_P"

[inputs]
P = { start = 100000.0, unit = "Pa", convert = "pint" }
rho = { start = 1000.0, unit = "kg/m**3", convert = "pint" }
g = { start = 9.80665, unit = "m/s**2", convert = "pint" }

[outputs]
y = { from = "return", unit = "cm" }    # docs: 1019.7 cm
