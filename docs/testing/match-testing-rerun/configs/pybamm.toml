# pybamm: the `init --probe` config, with the terminal voltage read from the solution step()
# returns. The Solution is not a Mapping: "Voltage [V]" is read as solution["Voltage [V]"] (built
# on demand), the path's key fallback. The time of the solution's last point is read too.
# No init_call: it would run one extra step() of the battery before t = 0, so every output would
# be one step ahead; the outputs are 0 at t = 0 instead.
[model]
entry = "pybamm:Simulation"
call = "step"
requirements = ["pybamm==26.10.1.1"]

[model.constants]
model = { call = "pybamm.lithium_ion:SPM()" }

[parameters]
cache_esoh = { start = true }
experiment_model_mode = { start = "legacy" }

[inputs]
dt = { start = 100.0, unit = "s" }
save = { start = true }

[outputs]
t = { from = "return:t.-1", unit = "s" }
voltage = { from = "return:Voltage [V].entries.-1", unit = "V" }
