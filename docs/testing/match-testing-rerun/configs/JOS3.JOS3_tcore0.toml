# The JOS3 hand config below, reading one element of the t_core array with `attr:t_core.0`.
# docs/testing/tested-models.md "Hand configs / JOS3" (described in prose there): inputs bound to
# attributes (to = "attr:tdb", ...), setup = options.update({'limit_dshiv/dt': True}), and the
# `globals` init writes for PRE_SHIV; environment at 10 degC as in the docs' check.
[model]
entry = "pythermalcomfort.models.jos3:JOS3"
call = "simulate"
globals = ["pythermalcomfort.jos3_functions.thermoregulation:PRE_SHIV"]
setup = ["options.update({'limit_dshiv/dt': True})"]

[parameters]
height = { start = 1.72 }
weight = { start = 74.43 }
age = { start = 20 }
sex = { start = "male" }

[inputs]
tdb = { start = 10.0, unit = "degC", to = "attr:tdb" }
tr = { start = 10.0, unit = "degC", to = "attr:tr" }
rh = { start = 50.0, unit = "%", to = "attr:rh" }
v = { start = 0.1, unit = "m/s", to = "attr:v" }
clo = { start = 0.5, to = "attr:clo" }
par = { start = 1.25, to = "attr:par" }
times = { start = 1, type = "Integer" }
dtime = { start = 60, type = "Integer" }
output = { start = false }

[outputs]
t_core_head = { from = "attr:t_core.0", unit = "degC" }   # core temperature of the head (segment 0); attr: paths now index numpy arrays
t_cb = { unit = "degC" }
t_skin_mean = { unit = "degC" }
w_mean = {}
