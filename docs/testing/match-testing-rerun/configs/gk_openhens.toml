# the `init --probe` config, with the output docs/testing/tested-models.md adds by hand
# fmugen.toml: how this Python model becomes an FMU. Reference: docs/config.md
# Generated by `fmugen init`; check the start values, add units, and remove what you don't need.

[model]
entry = "openhens:OpenHENS"
call = "solve"
sources = ["examples/cases/Four-stream-Yee-and-Grossmann-1990-1.csv"]
cwd = "."  # the model opens examples/cases/Four-stream-Yee-and-Grossmann-1990-1.csv by a relative path: they are copied into the FMU and the model runs in that folder

[parameters]
input_folder = { start = "examples/cases/Four-stream-Yee-and-Grossmann-1990-1.csv" }  # start from --start (passed through **kwargs)
output_folder = { start = "examples/results/Four-stream-Yee-and-Grossmann-1990-1" }  # start from --start (passed through **kwargs)
min_dT_list = { dimensions = [1], start = [10.0] }  # start from --start (passed through **kwargs)
min_dqda_list = { dimensions = [3], start = [1.0, 2.0, 3.0] }  # start from --start (passed through **kwargs)
stage_selection = { start = "automated" }  # start from --start (passed through **kwargs)
tolerance = { start = 0.001 }  # start from --start (passed through **kwargs)
max_parallel = { start = 10 }  # start from --start (passed through **kwargs)
best_solns_to_save = { start = 10 }  # start from --start (passed through **kwargs)
log_level = { start = 30 }  # start from --start (passed through **kwargs)

[outputs]
TAC = { from = "attr:_best_solns.0.case.TAC" }   # added by hand, as in docs/testing/tested-models.md
# no outputs found: add [outputs] by hand (e.g. attributes or properties of the model object)
